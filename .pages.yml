settings:
  content:
    merge: true
media:
  input: public/media
  output: /media
  rename: safe
  categories: [image]
content:
  - name: books
    label: Books
    type: collection
    path: content/books
    format: json
    filename: "{primary}.json"
    view:
      primary: title
      fields: [title, grade, publisher, price, published]
      search: [title, code, publisher]
      sort: [title, grade, publisher]
    fields:
      - name: title
        label: Book name
        type: string
        required: true
      - name: code
        label: Book code (optional)
        type: string
      - name: grade
        label: Grade
        type: select
        required: true
        options:
          values:
            - name: "1"
              label: Grade 1
            - name: "2"
              label: Grade 2
            - name: "3"
              label: Grade 3
            - name: "4"
              label: Grade 4
            - name: "5"
              label: Grade 5
      - name: publisher
        label: Publishing company
        type: string
      - name: category
        label: Subject or category
        type: string
      - name: product_type
        label: Product type
        type: select
        options:
          values:
            - name: book
              label: Single book
            - name: package
              label: Book package
      - name: price
        label: Selling price (LKR)
        type: number
        options:
          min: 0
      - name: description
        label: Description
        type: text
      - name: cover
        label: Book cover image
        type: image
      - name: previews
        label: Sample page images (in order)
        type: image
        options:
          multiple:
            max: 16
      - name: published
        label: Show on website
        type: boolean
  - name: business
    label: Business settings
    type: file
    path: content/settings.json
    format: json
    operations:
      delete: false
    fields:
      - name: whatsapp
        label: WhatsApp Business number (94... without +)
        type: string
      - name: tagline
        label: Homepage description
        type: text
      - name: demo_mode
        label: Show demo notice
        type: boolean
      - name: announcement
        label: Small top announcement
        type: string